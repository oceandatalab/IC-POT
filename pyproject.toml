[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icpot"
version = "0.1.0"
description = "Intent-controlled partial optimal transport with pointwise unmatched costs."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Parth Tripathi", email = "parth.tripathi@oceandatalab.com"},
  {name = "Bertrand Chapron"},
  {name = "Fabrice Collard"},
  {name = "Nicolas Courty"},
  {name = "Ronan Fablet"},
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/oceandatalab/IC-POT"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icpot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
